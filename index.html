<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDH Inspector</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
  <h1>BDH Inspector</h1>
  <select id="inputSelect">
    <option value="0">"The cat sat"</option>
  </select>
</header>

<nav class="bottom-bar">
  <button class="signal-btn active" data-signal="pipeline">Pipeline</button>
  <button class="signal-btn" data-signal="sparsity">Sparsity</button>
  <button class="signal-btn" data-signal="activations">Activations</button>
  <button class="signal-btn" data-signal="attention">Attention</button>
  <button class="signal-btn" data-signal="rope">RoPE</button>
</nav>

<section class="card">
  <h3>Layer Pipeline</h3>
  <div id="treeContent"></div>
</section>

<section class="card">
  <h3>Visualization</h3>
  <div id="vizContainer"></div>
</section>

<section class="card">
  <h3>Signal Stats</h3>
  <div id="statsContent">
    <p class="placeholder">Select a layer to see stats</p>
  </div>
</section>

<!-- data.js lives in the ROOT folder, not js/ -->
<script src="data.js"></script>
<script src="js/utils.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/sparsity.js"></script>
<script src="js/comparison.js"></script>
<!-- if you added the attention/rope files later, uncomment these:
<script src="js/attention.js"></script>
<script src="js/rope.js"></script>
-->
<script src="js/app.js"></script>
<script src="js/topology.js"></script>
</body>
</html>

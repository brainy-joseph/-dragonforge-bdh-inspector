<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDH Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="top-bar">
  <div class="nav-left">
    <span class="brand">BDH Inspector</span>
    <div class="bottom-bar">
      <button class="signal-btn active" data-signal="pipeline">Pipeline</button>
      <button class="signal-btn" data-signal="sparsity">Sparsity</button>
      <button class="signal-btn" data-signal="activations">Activations</button>
      <button class="signal-btn" data-signal="attention">Attention</button>
      <button class="signal-btn" data-signal="rope">RoPE</button>
    </div>
  </div>
  <div class="nav-right">
    <div class="input-chip">
      <span class="chip-label">Input:</span>
      <select id="inputSelect">
        <option value="0">"The cat sat"</option>
      </select>
    </div>
  </div>
</nav>

<div class="sys-strip">
  <span>● SYSTEM ONLINE</span>
  <span>MODEL: BDH-25M (UNTRAINED)</span>
  <span>DATA: 96 CAPTURES LOADED</span>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <div class="panel-label">Layer Pipeline</div>
      <div class="side-sub">Transformer Blocks</div>
    </div>
    <div class="side-body" id="treeContent"></div>
  </aside>

  <main class="main">
    <section class="panel">
      <div class="panel-head"><h2 class="panel-label">Visualization</h2></div>
      <div class="panel-body" id="vizContainer"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 class="panel-label">Signal Stats</h2></div>
      <div class="panel-body" id="statsContent">
        <p class="placeholder">Select a layer to see stats</p>
      </div>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script src="js/utils.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/sparsity.js"></script>
<script src="js/comparison.js"></script>
<script src="js/app.js"></script>
<script src="js/topology.js"></script>
<script src="js/unlock.js"></script>
<script src="js/gain.js"></script>
<script src="js/insights.js"></script>
</body>
</html>
